name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name xam_huong .
      - run: |
          mkdir -p lib assets/sounds assets/icon
          mv -f main.dart xam_huong_engine.dart xam_huong_game.dart lib/
          mv -f *.wav assets/sounds/
          mv -f icon.png icon_fg.png assets/icon/
          mv -f app_pubspec.yaml pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="Xăm Hường"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: xam-huong-apk
          path: build/app/outputs/flutter-apk/app-release.apk
